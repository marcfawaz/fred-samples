version: v1

common_model_settings:
  temperature: 0.0
  timeout:
    connect: 10.0
    read: 120.0

default_profile_by_capability:
  chat: chat.ollama.gptoss20b
  language: language.ollama.gptoss20b

profiles:

  - profile_id: chat.ollama.gptoss20b
    capability: chat
    description: "Local Ollama Mistral profile for private/offline chat experimentation."
    model:
      provider: ollama
      name: "nemotron3:33b-q4_K_M"
      settings:
        base_url: "http://localhost:11434"

  - profile_id: language.ollama.gptoss20b
    capability: language
    description: "Local Ollama Mistral profile for private/offline language tasks."
    model:
      provider: ollama
      name: "nemotron3:33b-q4_K_M"
      settings:
        base_url: "http://localhost:11434"

  - profile_id: default.chat.mistral
    capability: chat
    description: "Default chat model."
    model:
      provider: openai
      name: mistral-medium-2508
      settings:
        base_url: https://api.mistral.ai/v1
        max_retries: 2

  - profile_id: default.language.mistral
    capability: language
    description: "Default language model for structured text tasks."
    model:
      provider: openai
      name: mistral-medium-2508
      settings:
        base_url: https://api.mistral.ai/v1
        max_retries: 2

  - profile_id: mock.chat
    capability: chat
    description: "Local mock model for offline testing."
    model:
      provider: openai
      name: gpt-4o
      settings:
        base_url: http://localhost:8383/v1

  - profile_id: mock.language
    capability: language
    description: "Local mock model for offline testing."
    model:
      provider: openai
      name: gpt-4o
      settings:
        base_url: http://localhost:8383/v1

rules: []
